buildscript {
  repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
  }
}

plugins {
  id 'idea'
  id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
  id 'com.matthewprenger.cursegradle' version '1.4.0'
  id 'nu.studer.credentials' version '1.0.7'
  id "com.modrinth.minotaur" version "2.+"
}

base {
  archivesName = "${mod_id}-forge-${minecraft_version}"
}

minecraft {
  mappings channel: 'official', version: minecraft_version

  reobf = false
  copyIdeResources = true

  runs {

    configureEach {
      workingDirectory project.file('run')
      property 'forge.logging.markers', 'REGISTRIES'
      property 'forge.logging.console.level', 'debug'
    }

    client {
      property 'forge.enabledGameTestNamespaces', mod_id
    }

    server {
      property 'forge.enabledGameTestNamespaces', mod_id
    }

    gameTestServer {
      property 'forge.enabledGameTestNamespaces', mod_id
    }

    data {
      workingDirectory project.file('run-data')
      args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
      mods {
        modDataRun {
          //source sourceSets.main
          source project(":Common").sourceSets.main
        }
      }
    }
  }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
  minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
  compileOnly project(":Common")

  // Additional helpful Mods for development
  // runtimeOnly fg.deobf("curse.maven:jei-238222:4767571")

  // Hack fix for now, force jopt-simple to be exactly 5.0.4 because Mojang ships that version, but some transtive dependencies request 6.0+
  implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

tasks.withType(JavaCompile) {
  source(project(":Common").sourceSets.main.allSource)
}

processResources {
  from project(":Common").sourceSets.main.resources
}

curseforge {
  apiKey = "${credentials.curseforge_api_token}"
  project {
    id = "${curseforge_project_id}"
    changelog = file("../CHANGELOG.md")
    changelogType = 'markdown'
    releaseType = 'release'
    addGameVersion("${minecraft_version}")
    addGameVersion("Forge")
  }
  options {
    forgeGradleIntegration = true
  }
}

modrinth {
  token = "${credentials.modrinth_api_token}"
  projectId = "${modrinth_project_id}"
  versionNumber = "${version}"
  versionType = "${modrinth_release_type}"
  uploadFile = jar
  gameVersions = ["${minecraft_version}"]
  loaders = ["forge"]
}

// Merge the resources and classes into the same directory.
// This is done because java expects modules to be in a single directory.
// And if we have it in multiple we have to do performance intensive hacks like having the UnionFileSystem
// This will eventually be migrated to ForgeGradle so modders don't need to manually do it. But that is later.
sourceSets.each {
  def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
  it.output.resourcesDir = dir
  it.java.destinationDirectory = dir
}

