plugins {
  id 'net.neoforged.moddev' version '2.0.126'
}

base {
  archivesName = "${mod_name}-common-${minecraft_version}"
}

neoForge {
  neoFormVersion = neo_form_version
}

dependencies {
  compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.7'

  testImplementation platform('org.junit:junit-bom:5.11.4')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testImplementation 'com.google.code.gson:gson:2.10'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
  inputs.file(rootProject.file('Fabric/src/main/java/de/markusbordihn/fireextinguisher/FireExtinguisherClient.java'))
}

processResources {
  def buildProps = project.properties.clone()

  filesMatching(['pack.mcmeta']) {
    expand buildProps
  }
}

tasks.register("prepareWorkspace") {
  group = "ide"
  description = "Runs post-sync tasks for IDE integration"
}
