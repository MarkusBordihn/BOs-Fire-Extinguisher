plugins {
  id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT'
}

archivesBaseName = "${mod_name}-common-${minecraft_version}"

minecraft {
  version(minecraft_version)
  runs {
    server('vanilla_server') {
      workingDirectory(this.file("run"))
    }
    client('vanilla_client') {
      workingDirectory(this.file("run"))
    }
  }
}

dependencies {
  compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.7'

  testImplementation platform('org.junit:junit-bom:5.11.4')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testImplementation 'com.google.code.gson:gson:2.10'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
  inputs.file(rootProject.file('Fabric/src/main/java/de/markusbordihn/fireextinguisher/FireExtinguisherClient.java'))
}

processResources {
  def buildProps = project.properties.clone()

  filesMatching(['pack.mcmeta']) {
    expand buildProps
  }
}
