plugins {
  id 'net.neoforged.moddev' version '2.0.141'
}

base {
  archivesName = "${mod_name}-common-${minecraft_version}"
}

neoForge {
  neoFormVersion = project.neo_form_version

  // Add Minecraft classes to test configuration
  addModdingDependenciesTo(sourceSets.test)
}

dependencies {
  compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.7'

  testImplementation platform('org.junit:junit-bom:5.11.4')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testImplementation 'com.google.code.gson:gson:2.10'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
}

processResources {
  inputs.property "version", project.version

  filesMatching(['pack.mcmeta']) {
    expand "version": project.version
  }
}

tasks.register('prepareWorkspace') {
  description = 'Prepares the workspace (compatibility task for moddev)'
  group = 'neoforge'
}
